name: go

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  build:
    name: go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go install gotest.tools/gotestsum@v1.12.1
      # --format testname is what produces `PASS pkg.TestName (0.00s)` per test and
      # the `=== Failed` summary the parser reads.
      - run: gotestsum --format testname -- -v ./...
        working-directory: go
