name: rust

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled on the runner image, so no toolchain action is needed.
      - run: cargo test
        working-directory: rust
