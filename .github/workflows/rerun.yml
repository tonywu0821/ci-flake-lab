name: rerun

# The failure has to be made to disappear: a rerun that goes green on the same
# commit is the case this repository exists to produce. It cannot live in the
# workflows above — a run cannot rerun itself while it is still in progress — so it
# hangs off workflow_run instead.
#
# workflow_run only ever runs from the default branch, whatever branch triggered it.
on:
  workflow_run:
    workflows:
      [
        jest-default,
        jest-github-actions,
        jest-silent,
        jest-random,
        cypress,
        go,
        vitest,
        mocha,
        playwright,
        pytest,
        rust,
        rspec,
        phpunit,
        maven,
        gradle,
        dotnet,
        node-test,
      ]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    # Only the first attempt. Without this a run that fails twice reruns forever.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - run: gh run rerun ${{ github.event.workflow_run.id }} --failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
